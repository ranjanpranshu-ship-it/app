services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Optional: mount Docker socket for Docker-in-Docker builds
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC

volumes:
  jenkins_home:   